<def format="2">
  <!-- die() prints, runs the cleanup hooks and exits: code after it is unreachable. -->
  <function name="die">
    <noreturn>true</noreturn>
    <formatstr/>
    <arg nr="1"><formatstr/><not-null/></arg>
  </function>
</def>
