# Proposes updates of the pinned GitHub Actions and of the tools CI and the
# docs install. The odycat package itself has no dependencies.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directories: [/, /docs]
    schedule:
      interval: monthly
