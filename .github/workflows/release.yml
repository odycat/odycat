# Copyright (c) 2026 Ocean Octane S.L.U.
# Release: a tag vX.Y.Z builds, checks and publishes that version.
#
#   check     the tag matches the version; CHANGELOG entry dated; the
#             support end of its major version (SUPPORT_END, SECURITY.md)
#   source    sdist, the pure-Python wheel, the full source tarball (engine
#             included) and the installer (install/ with packaging/)
#   engine    the engine binary per architecture, built on the oldest
#             supported glibc (Ubuntu 24.04) against the pinned IgH
#             (install/versions.env) installed in /usr/local, as the
#             installer installs it on the target
#   wheels    one cp311-abi3 manylinux wheel per architecture (cibuildwheel),
#             tested on Python 3.11-3.14 as installed
#   assemble  every file checked (versions, wheel contents), SHA256SUMS, and
#             build provenance attested (Sigstore; `gh attestation verify`)
#   release   a draft GitHub release with every file and the CHANGELOG entry
#   pypi      PyPI by Trusted Publishing (no token), with PEP 740
#             attestations; waits for approval in the "pypi" environment
#
# The documentation is built by Read the Docs from the tag.
#
# Rehearsal: "Run workflow" on main (workflow_dispatch) builds, checks and
# attests everything as for a release, from the version in the tree, and
# stops there: no tag check, no GitHub release, nothing to PyPI. The files
# are the "release" artifact of the run.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:              # rehearsal (see above)

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - if: github.event_name == 'push'
        run: python3 ci/release_check.py tag "$GITHUB_REF_NAME"
      - if: github.event_name != 'push'
        run: echo "Rehearsal from $GITHUB_REF_NAME - no tag check, no release, nothing to PyPI"

  source:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - name: sdist, pure wheel, source tarball
        run: |
          set -eu
          V=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/odycat/_version.py)
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          python -m build --sdist -o dist
          ODYCAT_PURE=1 python -m build --wheel -o dist
          git archive --format=tar.gz --prefix="odycat-$V/" -o "dist/odycat-$V-source.tar.gz" HEAD
          T=odycat-install-$V
          mkdir "$T"
          cp -a install/. "$T/"
          cp -a packaging "$T/packaging"
          echo "ODYCAT_VERSION=$V" > "$T/release.env"
          tar --sort=name --owner=0 --group=0 --mtime="@$SOURCE_DATE_EPOCH" -czf "dist/$T.tar.gz" "$T"
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: source
          path: dist/
          if-no-files-found: error

  engine:
    needs: check
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          autoconf automake libtool pkg-config libcjson-dev
      # The IgH userland where the installer puts it on the target, so the
      # binary's library path is the target's.
      - run: sudo bash ci/build_igh.sh /usr/local
      - name: engine binary
        run: |
          set -eu
          V=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/odycat/_version.py)
          D=odycat-engine-$V-linux-$(uname -m)
          make -C engine IGH=/usr/local
          engine/odycat --version | grep -q "^odycat $V "
          mkdir "$D" dist
          cp engine/odycat LICENSE "$D/"
          tar --sort=name --owner=0 --group=0 --mtime="@$(git log -1 --format=%ct)" -czf "dist/$D.tar.gz" "$D"
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: engine-${{ matrix.runner }}
          path: dist/
          if-no-files-found: error

  wheels:
    needs: check
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: pypa/cibuildwheel@b9e566a2b284570af229f6c2a33673410d0389a3  # v4.3.4
        with:
          output-dir: wheelhouse
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: wheels-${{ matrix.runner }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  assemble:
    needs: [source, engine, wheels]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write          # Sigstore signing of the attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - run: python3 ci/release_check.py dist dist
      - run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error

  release:
    needs: assemble
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write          # create the draft release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release
          path: dist
      - name: Release notes from CHANGELOG.md
        run: |
          python3 - "${GITHUB_REF_NAME#v}" > notes.md <<'PY'
          import re, sys
          text = open("CHANGELOG.md", encoding="utf-8").read()
          v = re.escape(sys.argv[1])
          m = re.search(rf"^## \[{v}\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.S | re.M)
          print(m.group(1).strip())
          print("\nVerify a file: `gh attestation verify <file> --repo ${{ github.repository }}`;"
                " SHA256SUMS lists the checksums.")
          PY
      - run: >-
          gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag
          --title "OdyCAT ${GITHUB_REF_NAME#v}" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}

  pypi:
    needs: release
    runs-on: ubuntu-24.04
    environment:
      name: pypi               # required reviewers: set in the repository settings
      url: https://pypi.org/project/odycat/
    permissions:
      id-token: write          # Trusted Publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release
          path: dist
      - run: |
          mkdir pypi
          cp dist/*.whl "dist/odycat-${GITHUB_REF_NAME#v}.tar.gz" pypi/
          ls -l pypi
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          packages-dir: pypi/
