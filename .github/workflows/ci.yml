# CI: every push and pull request, and weekly (longer fuzzing). The jobs run
# the scripts in ci/, which work the same on a developer machine.
#
# Actions are pinned to a commit; Dependabot (.github/dependabot.yml) proposes
# updates.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"          # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-dev.txt
      - run: PYTHON=python bash ci/lint.sh

  # The package as installed, with odycat._atomic (required here), on every
  # supported Python and both architectures. The engine's config parser
  # tests need libcjson-dev.
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcjson-dev
      - run: python -m pip install -r requirements-dev.txt
      - run: ODYCAT_REQUIRE_EXT=1 python -m pip install .
      - run: ODYCAT_TEST_INSTALLED=1 PYTHON=python bash ci/test.sh

  # The engine against the IgH userland (built from source, cached), static
  # analysis, and the config parser test tool.
  engine:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          autoconf automake libtool pkg-config libcjson-dev
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/igh
          key: igh-${{ matrix.runner }}-${{ hashFiles('ci/build_igh.sh', 'install/versions.env') }}
      - run: bash ci/build_igh.sh ~/.cache/igh
      # cppcheck from PyPI: the version ci/cppcheck.cfg was checked with, on
      # x86-64 and on aarch64 (Orange Pi Zero3).
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install cppcheck==1.5.3
      - run: IGH=~/.cache/igh bash ci/check_engine.sh

  # libFuzzer on the engine's config parser (it reads its input as root).
  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang libcjson-dev
      - run: bash ci/fuzz_config.sh ${{ github.event_name == 'schedule' && 1800 || 120 }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: fuzz-findings
          path: |
            crash-*
            leak-*
            timeout-*
          if-no-files-found: ignore

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install -r docs/requirements.txt
      - run: python -m sphinx -W --keep-going -b html docs docs/_build/html

  # The release wheels, built as the release workflow builds them, so that a
  # packaging problem shows before a tag. Not on pull requests (slow).
  wheels:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e  # v4.3.5
        with:
          output-dir: wheelhouse
